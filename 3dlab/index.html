<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Humanoid Aiming</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2, 2, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(5, 10, 5);
    scene.add(sun);

    // --- Build the Block Humanoid ---
    const humanoid = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });

    // Torso
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), bodyMat);
    torso.position.y = 1.2;
    humanoid.add(torso);

    // Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), skinMat);
    head.position.y = 2.0;
    humanoid.add(head);

    // Right Arm Pivot (This is the shoulder)
    const rightArmPivot = new THREE.Group();
    rightArmPivot.position.set(-0.5, 1.7, 0); // Position at shoulder
    humanoid.add(rightArmPivot);

    const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), skinMat);
    rightArm.position.y = -0.3; // Offset so it rotates around the shoulder
    rightArmPivot.add(rightArm);

    // Point the arm forward (Aiming)
    rightArmPivot.rotation.x = -Math.PI / 2; 

    scene.add(humanoid);

    // --- Load the Gun ---
    const loader = new GLTFLoader();
    loader.load('./files/3d/gun.glb', (gltf) => {
        const gun = gltf.scene;
        
        // Attach gun to the arm so it follows the arm's rotation
        rightArmPivot.add(gun);

        // Position gun at the "hand" (bottom of the arm box)
        gun.position.set(0, -0.7, 0); 
        gun.rotation.set(Math.PI / 2, Math.PI, 0); 
        gun.scale.set(0.3, 0.3, 0.3);
    });

    // --- Background Assets ---
    loader.load('./files/3d/target.glb', (gltf) => {
        gltf.scene.position.set(-0.5, 1.5, -5);
        scene.add(gltf.scene);
    });

    // Floor (optional, helps ground the scene)
    const grid = new THREE.GridHelper(10, 10);
    scene.add(grid);

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
