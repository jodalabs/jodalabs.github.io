<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Loader</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* Loading Overlay */
        #loader-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            color: white; transition: opacity 0.5s ease;
        }
        #progress-wrapper {
            width: 300px; height: 10px; background: #333;
            border-radius: 5px; overflow: hidden; margin-top: 20px;
        }
        #progress-bar {
            width: 0%; height: 100%; background: #00ff88;
            box-shadow: 0 0 15px #00ff88; transition: width 0.1s;
        }

        /* Game UI */
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; background: rgba(0,0,0,0.7); padding: 30px; text-align: center;
            cursor: pointer; border: 1px solid #00ff88; display: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            border: 2px solid rgba(0, 255, 136, 0.5); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
    </style>
</head>
<body>

<div id="loader-container">
    <div id="status">INITIALIZING ARMORY...</div>
    <div id="progress-wrapper">
        <div id="progress-bar"></div>
    </div>
</div>

<div id="instructions">
    <h1 style="color: #00ff88;">EQUIPMENT READY</h1>
    <p>CLICK TO ENTER PERSPECTIVE</p>
    <p style="font-size: 0.8em; color: #888;">WASD TO MOVE | MOUSE TO LOOK</p>
</div>

<div id="crosshair"></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    // UI Elements
    const progressBar = document.getElementById('progress-bar');
    const loaderContainer = document.getElementById('loader-container');
    const instructions = document.getElementById('instructions');

    // Scene & Camera
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x111111, 0.1);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const light = new THREE.PointLight(0x00ff88, 10, 50); // Cool neon light
    light.position.set(5, 5, 5);
    scene.add(light);

    // Player Group
    const player = new THREE.Group();
    scene.add(player);

    const armPivot = new THREE.Group();
    armPivot.position.set(0.45, 1.45, -0.3); 
    player.add(armPivot);

    const arm = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.18, 0.8),
        new THREE.MeshStandardMaterial({ color: 0xffdbac })
    );
    arm.position.z = -0.3;
    armPivot.add(arm);

    camera.position.set(0, 1.7, 0);
    player.add(camera);

    // Controls
    const controls = new PointerLockControls(camera, document.body);
    instructions.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => instructions.style.display = 'none');
    controls.addEventListener('unlock', () => instructions.style.display = 'block');

    // --- Loading with Progress Bar ---
    const loader = new GLTFLoader();
    
    loader.load(
        './files/3d/gun.glb',
        (gltf) => {
            // SUCCESS
            const gun = gltf.scene;
            armPivot.add(gun);
            gun.position.set(0, 0, -0.8);
            gun.rotation.set(Math.PI / 2, Math.PI, 0); 
            gun.scale.set(0.8, 0.8, 0.8); // Bigger gun per your request

            // Fade out loader and show instructions
            loaderContainer.style.opacity = '0';
            setTimeout(() => {
                loaderContainer.style.display = 'none';
                instructions.style.display = 'block';
            }, 500);
        },
        (xhr) => {
            // PROGRESS
            const percent = (xhr.loaded / xhr.total) * 100;
            progressBar.style.width = percent + '%';
        },
        (error) => {
            console.error('Error loading gun:', error);
            document.getElementById('status').innerText = "LOAD ERROR";
        }
    );

    // Environment
    const grid = new THREE.GridHelper(100, 100, 0x00ff88, 0x222222);
    scene.add(grid);

    // Basic Movement Logic
    let moveF = false, moveB = false, moveL = false, moveR = false;
    document.addEventListener('keydown', (e) => {
        if(e.code === 'KeyW') moveF = true; if(e.code === 'KeyS') moveB = true;
        if(e.code === 'KeyA') moveL = true; if(e.code === 'KeyD') moveR = true;
    });
    document.addEventListener('keyup', (e) => {
        if(e.code === 'KeyW') moveF = false; if(e.code === 'KeyS') moveB = false;
        if(e.code === 'KeyA') moveL = false; if(e.code === 'KeyD') moveR = false;
    });

    const velocity = new THREE.Vector3();
    let prevTime = performance.now();

    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        if (controls.isLocked) {
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            if (moveF) velocity.z -= 40.0 * delta;
            if (moveB) velocity.z += 40.0 * delta;
            if (moveL) velocity.x -= 40.0 * delta;
            if (moveR) velocity.x += 40.0 * delta;

            controls.moveRight(-velocity.x * delta);
            controls.moveForward(-velocity.z * delta);
        }

        renderer.render(scene, camera);
        prevTime = time;
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
