<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Buddy</title><link rel="icon" href="../logo.png"><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#fff}video{position:absolute;width:120px;height:auto;pointer-events:none}</style></head><body><video id="v" src="./assets/talking.webm" autoplay muted loop playsinline></video><script>let redirected=false;function go(p){if(!redirected){redirected=true;window.location.href=p}}const req=indexedDB.open("buddyDB",1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("user"))db.createObjectStore("user",{keyPath:"id"})};req.onsuccess=e=>{try{const db=e.target.result;const tx=db.transaction("user","readonly");const store=tx.objectStore("user");const g=store.get(1);g.onsuccess=()=>{const d=g.result;if(!(d&&d.name&&d.age&&d.weight&&(d.height||d.heightFt)&&d.exercise&&d.goal&&d.unitWeight&&d.unitHeight)){go("../onboarding/")}};g.onerror=()=>go("../onboarding/")}catch{go("../onboarding/")}};req.onerror=()=>go("../onboarding/");setTimeout(()=>go("../onboarding/"),1500);const v=document.getElementById("v");let x=50,y=50,dx=1.2,dy=1;function move(){const w=window.innerWidth-120,h=window.innerHeight-120;x+=dx;y+=dy;if(x<=0||x>=w)dx*=-1;if(y<=0||y>=h)dy*=-1;v.style.transform=`translate(${x}px,${y}px)`;requestAnimationFrame(move)}move();</script></body></html>
