<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Buddy</title><link rel="icon" href="./logo.png"></head><body><script>let redirected=false;function go(p){if(!redirected){redirected=true;window.location.href=p}}const req=indexedDB.open("buddyDB",1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("user"))db.createObjectStore("user",{keyPath:"id"})};req.onsuccess=e=>{try{const db=e.target.result;const tx=db.transaction("user","readonly");const store=tx.objectStore("user");const g=store.get(1);g.onsuccess=()=>{const d=g.result;if(d&&d.name&&d.age&&d.weight&&(d.height||d.heightFt)&&d.exercise&&d.goal&&d.unitWeight&&d.unitHeight){go("./app/")}else{go("./onboarding/")}};g.onerror=()=>go("./onboarding/")}catch{go("./onboarding/")}};req.onerror=()=>go("./onboarding/");setTimeout(()=>go("./onboarding/"),1500);</script></body></html>
