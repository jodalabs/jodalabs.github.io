<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Buddy</title><link rel="icon" type="image/svg+xml" href="./logo.svg"></head><body><script>const req=indexedDB.open("buddyDB",1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("user"))db.createObjectStore("user",{keyPath:"id"})};req.onsuccess=e=>{const db=e.target.result;const tx=db.transaction("user","readonly");const store=tx.objectStore("user");const getReq=store.get(1);getReq.onsuccess=()=>{const data=getReq.result;if(data&&data.name&&data.age&&data.weight&&data.height||data.heightFt){window.location.href="./app/"}else{window.location.href="./onboarding/"}};getReq.onerror=()=>{window.location.href="./onboarding/"}};req.onerror=()=>{window.location.href="./onboarding/"}</script></body></html>
