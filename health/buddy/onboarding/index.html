<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Buddy</title><link rel="icon" type="image/svg+xml" href="../logo.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:16px}.logoRow{display:flex;align-items:center;gap:10px;margin-bottom:20px}.logoRow img{width:48px;height:48px;flex-shrink:0}.title{font-size:24px;font-weight:700}.container{width:100%;max-width:420px}.card{width:100%;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);padding:20px;display:flex;flex-direction:column;height:520px;overflow:hidden}.progressBg{width:100%;height:8px;background:rgba(0,0,0,.1);border-radius:999px;margin-bottom:16px;overflow:hidden}.progressBar{height:100%;background:#2563eb;width:0;transition:.3s}.questionBox{height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px;transition:.3s}.question{font-size:20px;font-weight:600;line-height:1.2}.sub{font-size:13px;color:#555;margin-top:4px;height:16px}.options{flex:1;overflow-y:auto;margin-top:8px;padding-right:4px;transition:.3s}.option{width:100%;padding:14px;border:1px solid #000;border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.2s;word-break:break-word}.option.selected{border-color:#2563eb;background:#eff6ff}.buttons{display:flex;justify-content:space-between;margin-top:12px;gap:10px}.btn{flex:1;padding:14px;border-radius:12px;font-weight:600;cursor:pointer}.btnBack{border:2px solid #2563eb;background:#fff;color:#2563eb}.btnNext{background:#2563eb;color:#fff;border:none}input{width:100%;max-width:100%;padding:14px;border-radius:12px;border:1px solid #000;font-size:16px}input:focus{outline:none;border-color:#2563eb}.fadeOut{opacity:0;transform:translateX(-20px)}.fadeIn{opacity:1;transform:translateX(0)}.fadeOutBack{opacity:0;transform:translateX(20px)}.fadeInBack{opacity:1;transform:translateX(0)}@media(max-height:600px){.card{height:460px}}@media(min-width:1024px){.container{max-width:480px}}</style></head><body><div class="logoRow"><img src="../logo.svg"><div class="title">Buddy</div></div><div class="container"><div class="card"><div class="progressBg"><div id="progress" class="progressBar"></div></div><div id="qBox" class="questionBox fadeIn"><div id="question" class="question"></div><div id="sub" class="sub"></div></div><div id="options" class="options fadeIn"></div><div class="buttons"><button id="backBtn" class="btn btnBack">BACK</button><button id="nextBtn" class="btn btnNext">NEXT</button></div></div></div><script src="index.js"></script></body></html>
